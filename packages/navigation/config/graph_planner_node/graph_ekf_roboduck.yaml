# Graph + EKF-localization params for roboduck (real robot).
# Tune these against the actual roboduck graph density and sensor characteristics.
# Loaded on top of default.yaml, then roboduck.yaml is loaded on top of this.

# Clustering
use_clustering: true
spatial_radius: 0.2
angle_threshold_deg: 45.0

# Edge building
edge_max_dist: 0.5
edge_max_heading_diff_deg: 130.0
# Fallback: if no edge was added for a node, connect the nearest within this range.
edge_rescue_dist: 4.0
# Cone (deg) for deduplicating near-parallel edges from the same source node.
edge_cone_threshold_deg: 10.0
# Forward-visibility cone: nodes more than this many degrees behind are ignored.
edge_visibility_deg: 100.0
# Max angle between edge direction and target-node heading for a strict candidate.
edge_direction_change_deg: 100.0
# Shortcut-edge pruning: drop direct (A,C) edge when a shorter 2..N-hop detour exists.
edge_prune_shortcuts: false
edge_prune_max_hops: 2

# Localization / candidate matching
candidate_max_dist: 0.7
candidate_k: 3
# Max heading diff (deg) between robot and graph node to be a localization candidate.
candidate_heading_tol_deg: 45.0
arrival_threshold: 0.3

# Directional command
skip_n_nodes: 4
