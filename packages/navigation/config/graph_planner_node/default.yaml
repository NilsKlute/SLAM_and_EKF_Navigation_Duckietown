# Universal graph_planner params — completely robot- and graph-independent.
# All tunable params live in <veh>.yaml and graph_ekf/slam_<veh>.yaml.

# Graph loading (cache file is already per-type: clustered_nodes_<type>.txt)
use_cached: false
data_dir: "/data/graph_planner"

# Set to true to show dead-reckoning pose alongside EKF in the debug image.
dr_overlay: false
