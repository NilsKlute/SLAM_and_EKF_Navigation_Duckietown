# Universal graph_planner params — graph-INDEPENDENT (scale- and density-invariant).
# Loaded for every localization type. Graph-specific params live in
# graph_ekf.yaml / graph_slam.yaml, loaded on top of this by the launch file.

# Graph loading (cache file is already per-type: clustered_nodes_<type>.txt)
use_cached: false
data_dir: "/data/graph_planner"

# Directional command — pure decision geometry, independent of the graph
turn_angle_threshold_deg: 35.0

# A* planner — pure decision geometry, independent of the graph
u_turn_thresh_deg: 120.0
