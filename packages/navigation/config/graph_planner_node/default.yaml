# Graph loading
use_cached: false
data_dir: "/data/graph_planner"

# Clustering (use_clustering: false → raw keyframes become graph nodes directly)
use_clustering: true
spatial_radius: 0.2
angle_threshold_deg: 45.0

# Edge building
edge_max_dist: 0.5
edge_max_heading_diff_deg: 130.0

# Localization / candidate matching
candidate_max_dist: 1.2
candidate_k: 3
arrival_threshold: 0.3

# Directional command
skip_n_nodes: 2
turn_angle_threshold_deg: 35.0

# A* planner
u_turn_thresh_deg: 120.0
