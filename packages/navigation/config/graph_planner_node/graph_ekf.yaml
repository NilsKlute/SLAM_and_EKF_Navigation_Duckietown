# Graph-specific params for EKF localization.
# EKF produces many dense raw keyframes (tens of thousands) that need clustering.
# Distances are in metres; skip_n_nodes is in nodes (density-dependent).
# Loaded on top of default.yaml.

# Clustering (use_clustering: false -> raw keyframes become graph nodes directly)
use_clustering: true
spatial_radius: 0.2
angle_threshold_deg: 45.0

# Edge building
edge_max_dist: 0.5
edge_max_heading_diff_deg: 130.0

# Localization / candidate matching
candidate_max_dist: 0.7
candidate_k: 3
arrival_threshold: 0.3

# Directional command
skip_n_nodes: 2
