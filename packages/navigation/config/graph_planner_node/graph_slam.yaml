# Graph-specific params for SLAM (RTAB) localization.
# The g2o graph is structured differently from the EKF keyframe cloud, so these
# are independent from graph_ekf.yaml. Values below are starting points copied
# from the EKF graph — TUNE them against the actual SLAM graph scale/density
# (inspect the debug image / node spacing).
# Loaded on top of default.yaml.

# Clustering (SLAM keyframes may already be sparse; try use_clustering: false first)
use_clustering: true
spatial_radius: 0.2
angle_threshold_deg: 45.0

# Edge building
edge_max_dist: 0.5
edge_max_heading_diff_deg: 130.0

# Localization / candidate matching
candidate_max_dist: 1.2
candidate_k: 3
arrival_threshold: 0.3

# Directional command
skip_n_nodes: 2
